name: Build custom Hub image

on:
  push:
    branches:
      - deploy/hub-2026-10-17

permissions:
  contents: read
  packages: write

concurrency:
  group: custom-hub-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish custom Hub
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/gurvancampion/paseo-hub:2026-10-17
          labels: |
            org.opencontainers.image.source=https://github.com/gurvancampion/hub
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=0.10.0-gurvan-2026-10-17
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=custom-hub
          cache-to: type=gha,scope=custom-hub,mode=max
      - name: Record immutable image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "Image ghcr.io/gurvancampion/paseo-hub@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
